name: CI for myLittleShop
on:
  push:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file for Docker
        run: |
          echo "MONGO_USER=${{ secrets.MONGO_USER }}" >> .env
          echo "MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}" >> .env
          echo "MONGO_DB=${{ secrets.MONGO_DB }}" >> .env
          echo "MONGO_EXP_PASSWORD=admin" >> .env
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env

      - name: Start Docker Containers
        run: docker compose up -d

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test with Maven
        run: |
          chmod +x mvnw
          ./mvnw clean package -e \
            -DPOSTGRES_PORT=5433 \
            -DPOSTGRES_DB="${{ secrets.POSTGRES_DB }}" \
            -DPOSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            -DPOSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            -DMONGO_PORT=27017 \
            -DMONGO_USER="${{ secrets.MONGO_USER }}" \
            -DMONGO_PASSWORD="${{ secrets.MONGO_PASSWORD }}" \
            -DMAIL_HOST="${{ secrets.MAIL_HOST }}" \
            -DMAIL_USERNAME="${{ secrets.MAIL_USERNAME }}" \
            -DMAIL_PASSWORD="${{ secrets.MAIL_PASSWORD }}" \
            -DJWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}"